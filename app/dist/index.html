<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>同传字幕</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none; }
  #ctl, #bar { display: flex; gap: 6px; padding: 5px 10px; align-items: center; flex-wrap: wrap; }
  #ctl { border-bottom: 1px solid rgba(255,255,255,.08); }
  .btn { background: rgba(20,20,25,.85); color: #eee; border: 1px solid #444; border-radius: 6px;
         padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: rgba(60,60,70,.9); }
  .btn.on { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
  .status { color: #9ad; font-size: 12px; flex: 1; text-align: right;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select, input { background: rgba(20,20,25,.85); color: #eee; border: 1px solid #444;
                  border-radius: 6px; padding: 3px 6px; font-size: 12px; }
  #docPath { width: 180px; }
  #lines { padding: 2px 12px 8px; max-height: 180px; overflow-y: auto; }
  .src { color: #cfd3da; font-size: 14px; line-height: 1.35; }
  .tgt { color: #ffd866; font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 7px; }
</style>
</head>
<body>
  <div id="ctl">
    <select id="source">
      <option value="mic">🎤 麦克风</option>
      <option value="system">🔊 系统声音</option>
    </select>
    <button class="btn" id="ttsBtn">🔇 TTS</button>
    <button class="btn" id="ocrBtn">🔍 圈选OCR</button>
    <input id="docPath" placeholder="文档路径 .txt/.md" />
    <button class="btn" id="readBtn">📖 阅读</button>
  </div>
  <div id="bar">
    <button class="btn" id="startBtn">▶ 同传</button>
    <button class="btn" id="stopBtn">⏹ 停止</button>
    <span class="status" id="status">idle</span>
  </div>
  <div id="lines"></div>

<script>
  const { listen } = window.__TAURI__.event;
  const { invoke } = window.__TAURI__.core;
  const linesEl = document.getElementById('lines');
  const statusEl = document.getElementById('status');
  const sourceEl = document.getElementById('source');
  const ttsBtn = document.getElementById('ttsBtn');
  const docPath = document.getElementById('docPath');

  let tts = false;
  let audioRunning = false;

  listen('subtitle', (e) => {
    const text = e.payload;
    if (text.startsWith('→')) {
      const tgt = document.createElement('div');
      tgt.className = 'tgt';
      tgt.textContent = text.slice(1).trim();
      linesEl.appendChild(tgt);
    } else {
      const src = document.createElement('div');
      src.className = 'src';
      src.textContent = text.trim();
      linesEl.appendChild(src);
    }
    while (linesEl.children.length > 40) linesEl.removeChild(linesEl.firstChild);
    linesEl.scrollTop = linesEl.scrollHeight;
  });

  listen('status', (e) => { statusEl.textContent = e.payload; });

  async function startAudio() {
    statusEl.textContent = 'starting pipeline…';
    try {
      await invoke('start_pipeline', { source: sourceEl.value, tts, seconds: 86400 });
      audioRunning = true;
      statusEl.textContent = (sourceEl.value === 'system' ? '🔊 系统声音' : '🎤 麦克风') + ' 同传中…';
    } catch (err) {
      audioRunning = false;
      statusEl.textContent = 'error: ' + err;
    }
  }

  document.getElementById('startBtn').addEventListener('click', startAudio);

  // 切换音源：运行中自动用新音源重启
  sourceEl.addEventListener('change', () => { if (audioRunning) startAudio(); });

  ttsBtn.addEventListener('click', async () => {
    tts = !tts;
    ttsBtn.textContent = tts ? '🔊 TTS:开' : '🔇 TTS';
    ttsBtn.classList.toggle('on', tts);
    if (audioRunning) await startAudio();   // 运行中切换 → 用新 SIMUL_TTS 环境重启
  });

  document.getElementById('stopBtn').addEventListener('click', async () => {
    try { await invoke('stop_all'); } catch (err) { /* ignore */ }
    audioRunning = false;
    statusEl.textContent = '⏹ 已停止';
  });

  document.getElementById('ocrBtn').addEventListener('click', async () => {
    statusEl.textContent = '请在屏幕上拖拽圈选…';
    try { await invoke('start_ocr', { select: true }); }
    catch (err) { statusEl.textContent = 'error: ' + err; }
  });

  document.getElementById('readBtn').addEventListener('click', async () => {
    const p = docPath.value.trim();
    if (!p) { statusEl.textContent = '先输入文档路径'; return; }
    statusEl.textContent = 'reading…';
    try { await invoke('read_doc', { path: p, dst: '' }); }
    catch (err) { statusEl.textContent = 'error: ' + err; }
  });
</script>
</body>
</html>
