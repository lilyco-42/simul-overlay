<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none; }
  #bar { display: flex; gap: 8px; padding: 8px 10px; align-items: center; }
  #bar .btn { background: rgba(20,20,25,.85); color: #eee; border: 1px solid #444; border-radius: 6px;
              padding: 4px 12px; font-size: 13px; cursor: pointer; }
  #bar .btn:hover { background: rgba(60,60,70,.9); }
  #bar .status { color: #9ad; font-size: 12px; }
  #lines { padding: 0 12px 10px; max-height: 165px; overflow-y: auto; }
  .src { color: #cfd3da; font-size: 14px; line-height: 1.35; }
  .tgt { color: #ffd866; font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 7px; }
</style>
</head>
<body>
  <div id="bar">
    <button class="btn" id="startBtn">● 开始同传 (60s)</button>
    <span class="status" id="status">idle</span>
  </div>
  <div id="lines"></div>

<script>
  const { listen } = window.__TAURI__.event;
  const { invoke } = window.__TAURI__.core;
  const linesEl = document.getElementById('lines');
  const statusEl = document.getElementById('status');
  let pendingSrc = null;

  listen('subtitle', (e) => {
    const text = e.payload;
    if (text.startsWith('→')) {
      const tgt = document.createElement('div');
      tgt.className = 'tgt';
      tgt.textContent = text.slice(1).trim();
      linesEl.appendChild(tgt);
      pendingSrc = null;
    } else {
      // 新源句到来时丢弃未配对的旧源句
      const src = document.createElement('div');
      src.className = 'src';
      src.textContent = text.trim();
      linesEl.appendChild(src);
      pendingSrc = src;
    }
    while (linesEl.children.length > 30) linesEl.removeChild(linesEl.firstChild);
    linesEl.scrollTop = linesEl.scrollHeight;
  });

  document.getElementById('startBtn').addEventListener('click', async () => {
    statusEl.textContent = 'starting pipeline…';
    try {
      await invoke('start_pipeline', { seconds: 60 });
      statusEl.textContent = '● listening';
    } catch (err) {
      statusEl.textContent = 'error: ' + err;
    }
  });
</script>
</body>
</html>
