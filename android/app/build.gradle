plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simul.overlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.simul.overlay"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 多 APK 按母语分渠道（用户拍板：中文/英文母语各一个包，applicationId 后缀可并存安装）
    flavorDimensions "target"
    productFlavors {
        cn {
            dimension "target"
            applicationIdSuffix ".cn"
            versionNameSuffix "-cn"
            resValue "string", "app_name", "同传字幕"
            buildConfigField "String", "DEFAULT_TARGET", "\"zh\""
        }
        en {
            dimension "target"
            applicationIdSuffix ".en"
            versionNameSuffix "-en"
            resValue "string", "app_name", "Simul Overlay"
            buildConfigField "String", "DEFAULT_TARGET", "\"en\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    // sherpa-onnx 官方 AAR（与桌面 pip 同版本 1.13.8），JitPack 源
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'
}
