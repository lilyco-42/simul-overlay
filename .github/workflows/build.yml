name: build-windows

permissions:
  contents: write  # tauri-action 创建 Release 并上传安装包需要

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 推送时自动创建 GitHub Release 并挂载安装包；分支推送仅构建
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: simul-overlay ${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
