name: build

permissions:
  contents: write  # tauri-action 创建 Release 并上传安装包需要

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # with_sidecar: M4 离线全量包（Windows 先行；mac/linux 验证 PyInstaller 后跟进）
          - os: windows-latest
            asset: windows-nsis-installer
            build_args: --bundles nsis
            bundles: app/src-tauri/target/release/bundle/nsis/*
            with_sidecar: true
          - os: macos-latest
            asset: macos-bundles
            build_args: --bundles dmg
            bundles: |
              app/src-tauri/target/release/bundle/dmg/*
              app/src-tauri/target/release/bundle/macos/*
            with_sidecar: false
          - os: ubuntu-latest
            asset: linux-bundles
            build_args: --bundles deb,appimage
            bundles: |
              app/src-tauri/target/release/bundle/deb/*
              app/src-tauri/target/release/bundle/appimage/*
            with_sidecar: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # ---- M4 离线全量包：Python 管线侧车 + 模型/语对随包 ----
      - name: Setup Python (sidecar pipeline)
        if: matrix.with_sidecar
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache offline models + lang pairs
        if: matrix.with_sidecar
        uses: actions/cache@v4
        with:
          path: |
            models
            !models/.cache
          key: offline-models-${{ runner.os }}-v1
          restore-keys: |
            offline-models-${{ runner.os }}-

      - name: Install pipeline deps (torch CPU first, avoid CUDA bloat)
        if: matrix.with_sidecar
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch offline models + core 6 lang pairs (~1.5GB, cached after 1st run)
        if: matrix.with_sidecar
        run: python fetch_models.py

      - name: Build sidecar (PyInstaller onedir)
        if: matrix.with_sidecar
        run: python build_sidecar.py

      - name: Stage sidecar + models into Tauri resources
        if: matrix.with_sidecar
        shell: bash
        run: |
          rm -rf app/src-tauri/resources/simul-pipe app/src-tauri/resources/models
          cp -r dist/simul-pipe app/src-tauri/resources/simul-pipe
          cp -r models app/src-tauri/resources/models

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 推送时自动创建 GitHub Release 并挂载安装包（三平台往同一 Release 上传）；
          # 分支推送仅构建 artifact
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: simul-overlay ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.build_args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  android:
    name: android-apk
    needs: build  # tag 时等 tauri-action 先建好 Release，APK 才能挂上去
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch ASR model into assets (offline-bundled, pruned)
        run: python3 android/fetch_model.py

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # cn/en 两个母语 flavor：apk/<flavor>/<buildType>/*.apk
          path: android/app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error

      - name: Attach APKs to release (tags only)
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" android/app/build/outputs/apk/*/*/*.apk --clobber
